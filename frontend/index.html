<!doctype html>
<html lang="vi" class="dark" style="color-scheme: dark; background-color: #070908;">

<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourtBooking - Nền Tảng Quản Lý Cụm Sân Thể Thao & Đặt Lịch Trực Tuyến</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('court-booking-ui-preferences');
        if (pref) {
          var data = JSON.parse(pref);
          var theme = data?.state?.theme;
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body class="min-h-screen bg-[#070908] font-sans antialiased text-slate-100 dark" style="background-color: #070908; color-scheme: dark;">
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
